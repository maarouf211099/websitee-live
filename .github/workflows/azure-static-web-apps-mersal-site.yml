name: Deploy to Azure (mersal-site)

# The Static Web App "mersal-site" (resource group mersal-site_group). Deploys main on every push, and on demand
# (Actions -> Deploy to Azure (mersal-site) -> Run workflow). No pull-request previews: the Free plan allows only 3
# staging environments and they filled up on the previous app.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_MERSAL_SITE = the app's deployment token
# (Azure Portal -> the Static Web App -> Overview -> Manage deployment token).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MERSAL_SITE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/mersal-site/public"
          api_location: "/mersal-site/api"
          output_location: "."
