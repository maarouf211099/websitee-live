<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#005959">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Titillium+Web:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<meta property="og:site_name" content="مؤسسة مرسال">
<meta property="og:image" content="https://www.mersal-ngo.org/img/hero.jpg">
<title>ألبومات الصور | مؤسسة مرسال</title>
<meta name="description" content="صور من فعاليات وحملات مؤسسة مرسال الخيرية.">
</head>
<body>
<div id="site-header"></div>
<div class="page-head"><div class="wrap">
  <h1>ألبومات الصور</h1>
  <p>لقطات من فعاليات وحملات مرسال</p>
</div></div>
<main id="main">
  <section>
    <div class="wrap grid grid-3 album-grid" id="albums" aria-live="polite"></div>
  </section>
</main>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="عرض الصور">
  <button type="button" class="lb-close" aria-label="إغلاق (Esc)">×</button>
  <button type="button" class="lb-prev" aria-label="الصورة السابقة">&#8250;</button>
  <span class="lb-count" aria-live="polite"></span>
  <figure>
    <div class="lb-stage"><img alt="" draggable="false"><span class="lb-spin" aria-hidden="true"></span></div>
    <figcaption></figcaption>
  </figure>
  <span class="lb-hint" aria-hidden="true">اسحب أو استخدم الأسهم ← → للتنقل · Esc للإغلاق</span>
  <button type="button" class="lb-next" aria-label="الصورة التالية">&#8249;</button>
</div>
<div id="site-footer"></div>
<script defer src="/js/layout.js"></script>
<script>
addEventListener("DOMContentLoaded", function () {
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lb = document.getElementById("lightbox"), img = lb.querySelector("img"), cap = lb.querySelector("figcaption"), count = lb.querySelector(".lb-count");
  var btnClose = lb.querySelector(".lb-close"), btnPrev = lb.querySelector(".lb-prev"), btnNext = lb.querySelector(".lb-next");
  var cur = null, idx = 0, lastFocus = null, cache = {};

  function preload(i) {
    if (!cur) return;
    var src = cur.photos[(i + cur.photos.length) % cur.photos.length];
    if (cache[src]) return;
    var im = new Image(); im.src = src; cache[src] = im;
  }
  function show(dir) {
    var src = cur.photos[idx], n = cur.photos.length;
    lb.classList.add("loading");
    var done = function () { lb.classList.remove("loading"); };
    img.onload = done; img.onerror = done;
    img.src = src; img.alt = cur.title + " - صورة " + (idx + 1);
    if (img.complete) done();
    // a small slide-in from the side the picture came from
    if (!reduce && dir) {
      img.style.transition = "none"; img.style.transform = "translateX(" + (dir > 0 ? "-" : "") + "24px)"; img.style.opacity = ".4";
      requestAnimationFrame(function () { requestAnimationFrame(function () { img.style.transition = ""; img.style.transform = ""; img.style.opacity = ""; }); });
    }
    cap.textContent = cur.title;
    count.textContent = (idx + 1) + " / " + n;
    btnPrev.disabled = btnNext.disabled = n < 2;
    preload(idx + 1); preload(idx - 1);
  }
  function open(a, i) {
    cur = a; idx = i || 0; show(0);
    lastFocus = document.activeElement; lb.hidden = false; document.body.style.overflow = "hidden";
    btnClose.focus();
    if (!history.state || !history.state.lb) history.pushState({ lb: 1 }, "", location.pathname + "?a=" + albumsList.indexOf(a));
  }
  function close(fromHistory) {
    if (lb.hidden) return;
    lb.hidden = true; document.body.style.overflow = ""; img.removeAttribute("src");
    if (lastFocus) lastFocus.focus();
    if (!fromHistory && history.state && history.state.lb) history.back();
  }
  function step(d) { if (!cur || cur.photos.length < 2) return; idx = (idx + d + cur.photos.length) % cur.photos.length; show(d); if (window.mersalTap) window.mersalTap(5); }
  btnClose.onclick = function () { close(); };
  btnNext.onclick = function () { step(1); };
  btnPrev.onclick = function () { step(-1); };
  lb.addEventListener("click", function (e) { if (e.target === lb || e.target.classList.contains("lb-stage") || e.target.tagName === "FIGURE") close(); });
  addEventListener("popstate", function () { if (!lb.hidden) close(true); });
  addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(1); }   /* RTL: left = next */
    else if (e.key === "ArrowRight") { e.preventDefault(); step(-1); }
    else if (e.key === "Home") { e.preventDefault(); idx = 0; show(-1); }
    else if (e.key === "End") { e.preventDefault(); idx = cur.photos.length - 1; show(1); }
    else if (e.key === "Tab") {
      // keep the focus inside the dialog
      var f = [btnClose, btnPrev, btnNext].filter(function (b) { return !b.disabled; }), i = f.indexOf(document.activeElement);
      e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  // touch: the picture follows the finger, a 50px (or fast) swipe moves to the next one
  var x0 = null, y0 = null, t0 = 0, dragging = false;
  lb.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); dragging = false;
  }, { passive: true });
  lb.addEventListener("touchmove", function (e) {
    if (x0 === null || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (!dragging && Math.abs(dx) < 8) return;
    if (!dragging && Math.abs(dy) > Math.abs(dx)) { x0 = null; return; }
    dragging = true;
    img.style.transition = "none"; img.style.transform = "translateX(" + dx + "px)"; img.style.opacity = String(Math.max(.4, 1 - Math.abs(dx) / 400));
  }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dt = Date.now() - t0; x0 = null;
    img.style.transition = ""; img.style.transform = ""; img.style.opacity = "";
    if (!dragging) return;
    if (Math.abs(dx) > 50 || (Math.abs(dx) > 20 && dt < 250)) step(dx > 0 ? -1 : 1); /* RTL: a swipe to the right goes back */
  });

  var albumsList = [];
  fetch("/data/albums.json").then(function (r) { return r.json(); }).then(function (albums) {
    albumsList = albums;
    var box = document.getElementById("albums");
    box.innerHTML = albums.map(function (a, i) {
      var cover = (a.thumbs || a.photos)[0];
      return '<button type="button" class="card album" data-i="' + i + '" aria-label="فتح ألبوم ' + esc(a.title) + ' (' + a.photos.length + ' صورة)">' +
        '<div class="thumb">' + window.mersalPic(cover, { alt: "", cls: "media", w: 600, h: 375, lazy: i > 1 }) +
          '<span class="count"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>' + a.photos.length + ' صورة</span></div>' +
        '<div class="body"><h3>' + esc(a.title) + '</h3><p>' + (a.date ? esc(a.date.slice(0, 4)) : "مرسال") + "</p></div></button>";
    }).join("");
    box.querySelectorAll(".album").forEach(function (b) { b.addEventListener("click", function () { open(albums[+b.dataset.i], 0); }); });
    if (window.mersalReveal) window.mersalReveal(box.children);
    var q = new URLSearchParams(location.search).get("a");
    if (q !== null && albums[+q]) { history.replaceState(null, "", location.pathname); open(albums[+q], 0); }
  }).catch(function () {
    document.getElementById("albums").innerHTML = '<p class="alert err" style="grid-column:1/-1">تعذر تحميل الألبومات. حاول مرة أخرى.</p>';
  });
});
</script>
</body>
</html>
